<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalorieArc // Daily Sync</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0A0A0C;
            --card-bg: #161618;
            --primary: #6366f1;
            --accent-pro: #3B82F6;
            --accent-carb: #F59E0B;
            --accent-fat: #EC4899;
            --text-main: #FFFFFF;
            --text-sub: #9CA3AF;
            --border: #27272A;
            --radius: 24px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding-bottom: 90px; }

        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        .hidden { display: none !important; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }

        /* HEADER */
        .header { margin-bottom: 30px; margin-top: 10px; }
        .logo { font-weight: 800; font-size: 1.8rem; background: linear-gradient(to right, #fff, #666); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .refresh-btn { background: #222; border: 1px solid var(--border); color: #fff; padding: 8px 12px; border-radius: 50px; cursor: pointer; font-size: 0.8rem; }

        /* DASHBOARD */
        .hero-card {
            background: var(--card-bg); border-radius: var(--radius); padding: 25px;
            border: 1px solid var(--border); position: relative; overflow: hidden;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
        }

        .cal-ring-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; }
        .cal-info h2 { font-size: 3rem; line-height: 1; font-weight: 800; }
        .cal-info p { color: var(--text-sub); font-size: 0.9rem; margin-top: 5px; }
        .cal-sub { font-size: 0.9rem; color: var(--primary); font-weight: 600; }

        .macro-bars { display: flex; flex-direction: column; gap: 15px; }
        .macro-row { display: flex; align-items: center; gap: 10px; }
        .macro-label { width: 50px; font-size: 0.8rem; font-weight: 600; color: var(--text-sub); }
        .bar-container { flex: 1; height: 8px; background: #2A2A2E; border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
        .macro-val { width: 60px; text-align: right; font-size: 0.8rem; font-weight: 700; }

        /* INPUT CARD */
        .input-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 20px; margin-top: 20px; position: relative;
        }
        
        .input-row { display: flex; gap: 10px; margin-top: 10px; }
        
        input, select {
            background: #000; border: 1px solid var(--border); color: #fff;
            padding: 12px; border-radius: 12px; font-size: 1rem; width: 100%; outline: none;
        }
        input:focus { border-color: var(--primary); }

        /* SEARCH */
        .search-wrapper { position: relative; width: 100%; }
        .suggestions-box {
            position: absolute; top: 105%; left: 0; width: 100%; background: #111;
            border: 1px solid var(--border); border-radius: 12px; max-height: 200px;
            overflow-y: auto; z-index: 50; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .suggestion-item { padding: 12px; border-bottom: 1px solid #222; cursor: pointer; font-size: 0.9rem; color: #ccc; display: flex; justify-content: space-between; }
        .suggestion-item:hover { background: #222; color: #fff; }
        .suggestion-meta { font-size: 0.8rem; color: var(--primary); font-weight: 600; }

        .btn-add {
            background: var(--primary); color: white; border: none; padding: 14px;
            border-radius: 12px; font-weight: 700; width: 100%; margin-top: 15px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        .btn-add:active { transform: scale(0.98); }

        /* LISTS */
        .section-title { font-size: 1.1rem; font-weight: 700; margin: 30px 0 15px 0; color: var(--text-main); }
        .food-item {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); padding: 15px; margin-bottom: 10px;
            border-radius: 16px; border: 1px solid rgba(255,255,255,0.03);
        }
        .food-main h4 { font-size: 1rem; margin-bottom: 3px; }
        .food-main p { font-size: 0.75rem; color: var(--text-sub); }
        .food-cal { font-weight: 700; color: var(--primary); }

        /* NAV */
        .nav-dock {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(22, 22, 24, 0.9); backdrop-filter: blur(10px);
            border: 1px solid var(--border); padding: 10px 20px; border-radius: 50px;
            display: flex; gap: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100;
        }
        .nav-icon { font-size: 1.5rem; opacity: 0.5; cursor: pointer; transition: 0.2s; }
        .nav-icon.active { opacity: 1; transform: translateY(-2px); }

        /* MODAL & LOADER */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            z-index: 200; display: none; justify-content: center; align-items: center;
        }
        .modal-card { background: var(--card-bg); width: 90%; max-width: 400px; padding: 25px; border-radius: 24px; border: 1px solid var(--border); }
        .modal-header { font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; }

        #loader { background: #000; z-index: 9999; transition: opacity 0.5s; }
        .loader-hidden { opacity: 0; pointer-events: none; }
        .spinner { border-top-color: var(--primary); }

    </style>
</head>
<body>

    <div id="loader" class="loader-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; display:flex; justify-content:center; align-items:center; flex-direction:column;">
        <div class="spinner" style="width:40px; height:40px; border:4px solid #333; border-top:4px solid #fff; border-radius:50%; animation:spin 1s infinite linear;"></div>
        <p style="margin-top:20px; color:#666;">Syncing Cloud Data...</p>
        <p id="error-msg" style="margin-top:10px; color:red; font-size:0.8rem; display:none;">Error</p>
        <style>@keyframes spin{100%{transform:rotate(360deg);}}</style>
    </div>

    <div class="container">
        <div class="header flex-between">
            <div class="logo">CalorieArc</div>
            <button class="refresh-btn" onclick="init(true)">↻ Sync</button>
        </div>

        <!-- HOME -->
        <div id="view-home" class="view-section">
            <div class="hero-card">
                <div class="cal-ring-container">
                    <div class="cal-info">
                        <div class="cal-sub">Remaining</div>
                        <h2 id="ui-rem">--</h2>
                        <p>Target: <span id="ui-goal">--</span></p>
                    </div>
                    <div style="width: 80px; height: 80px; border-radius: 50%; border: 6px solid #2A2A2E; display:flex; align-items:center; justify-content:center;">
                        <span id="ui-percent" style="font-weight:700;">0%</span>
                    </div>
                </div>
                <div class="macro-bars">
                    <div class="macro-row"><span class="macro-label">PRO</span><div class="bar-container"><div id="bar-pro" class="bar-fill" style="background:var(--accent-pro);width:0%"></div></div><span class="macro-val" id="val-pro">0</span></div>
                    <div class="macro-row"><span class="macro-label">CARB</span><div class="bar-container"><div id="bar-carb" class="bar-fill" style="background:var(--accent-carb);width:0%"></div></div><span class="macro-val" id="val-carb">0</span></div>
                    <div class="macro-row"><span class="macro-label">FAT</span><div class="bar-container"><div id="bar-fat" class="bar-fill" style="background:var(--accent-fat);width:0%"></div></div><span class="macro-val" id="val-fat">0</span></div>
                </div>
            </div>

            <div class="input-card">
                <label style="font-size:0.8rem; color:var(--text-sub); font-weight:600;">ADD ENTRY</label>
                <div class="search-wrapper">
                    <input type="text" id="foodSearch" placeholder="Search (e.g. Banana)" onkeyup="filterFoods()" autocomplete="off">
                    <div id="suggestions" class="suggestions-box"></div>
                </div>
                <input type="hidden" id="selectedFoodIdx">
                
                <div class="input-row">
                    <input type="number" id="qtyInput" placeholder="Quantity">
                    <div style="background:#222; padding:12px; border-radius:12px; border:1px solid var(--border); min-width:80px; text-align:center; color:#888; font-size:0.9rem;" id="unitLabel">
                        Unit
                    </div>
                </div>
                
                <button class="btn-add" onclick="logFood()">LOG ENTRY</button>
                <div style="text-align:center; margin-top:15px; font-size:0.8rem; color:var(--text-sub); cursor:pointer;" onclick="toggleModal('modal-add')">+ Create New Food</div>
            </div>

            <div class="section-title">Consumed Today</div>
            <div id="today-list"></div>
        </div>

        <!-- HISTORY -->
        <div id="view-history" class="view-section hidden">
            <div class="section-title">History Log</div>
            <div id="history-list"></div>
        </div>

        <!-- SETTINGS -->
        <div id="view-settings" class="view-section hidden">
            <div class="section-title">Goal Calculator</div>
            <div class="input-card">
                <div style="display:grid; gap:15px;">
                    <input type="number" id="calc-weight" placeholder="Weight (kg)">
                    <input type="number" id="calc-height" placeholder="Height (cm)">
                    <input type="number" id="calc-age" placeholder="Age">
                    <select id="calc-gender"><option value="m">Male</option><option value="f">Female</option></select>
                    <select id="calc-activity">
                        <option value="1.2">Sedentary</option>
                        <option value="1.375">Light</option>
                        <option value="1.55">Moderate</option>
                        <option value="1.725">Active</option>
                    </select>
                    <select id="calc-goal">
                        <option value="-500">Lose Fat</option>
                        <option value="0">Maintain</option>
                        <option value="250">Gain</option>
                    </select>
                    <button class="btn-add" onclick="calculateGoals()">UPDATE GOALS</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div id="modal-add" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">New Food Item</div>
            <div style="display:grid; gap:10px;">
                <input type="text" id="new-name" placeholder="Name">
                <div class="input-row">
                    <input type="text" id="new-unit" placeholder="Measurement (e.g. Cup)" style="width:70%">
                    <input type="number" id="new-base" placeholder="Base Qty (1)" value="1">
                </div>
                <div style="font-size:0.7rem; color:#666;">Nutrients per Base Qty</div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                    <input type="number" id="new-cal" placeholder="Calories">
                    <input type="number" id="new-pro" placeholder="Pro">
                    <input type="number" id="new-carb" placeholder="Carb">
                    <input type="number" id="new-fat" placeholder="Fat">
                </div>
                <button class="btn-add" onclick="createNewFood()">SAVE</button>
                <button onclick="toggleModal('modal-add')" style="background:transparent; border:none; color:#666; width:100%; padding:10px; cursor:pointer;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- NAV -->
    <div class="nav-dock">
        <div class="nav-icon active" id="nav-home" onclick="switchView('home')">🔥</div>
        <div class="nav-icon" id="nav-history" onclick="switchView('history')">📜</div>
        <div class="nav-icon" id="nav-settings" onclick="switchView('settings')">👤</div>
    </div>

    <script>
        // --- CONFIG ---
        // Paste your NEW URL here
        const API_URL = 'https://script.google.com/macros/s/AKfycbwpI7S9cvfYGVrwKMOK0e-Uh3BdpRXFK4A0VtkZBsNTN7pf0CShtN7OdoIZI5wHZPVh/exec'; 
        // --------------

        let db = { foods: [], history: [], daily: [], settings: {} };
        let targets = { cal: 2000, pro: 150, carb: 200, fat: 65 };

        function getLocalDate() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function init(force = false) {
            // Show loader if forced or no data
            document.getElementById('loader').classList.remove('loader-hidden');

            if(API_URL.includes('SCRIPT')) {
                alert("Please add API URL"); return;
            }

            try {
                // Fetch fresh data (timestamp prevents caching)
                const res = await fetch(`${API_URL}?action=getData&t=${Date.now()}`);
                if (!res.ok) throw new Error("Fetch Failed");
                const data = await res.json();
                
                db = data;
                localStorage.setItem('arc_db_v4', JSON.stringify(db)); // Save Sync
                
                updateUI();
                document.getElementById('loader').classList.add('loader-hidden');
            } catch(e) {
                console.error(e);
                // If offline, try to load cache
                const cached = localStorage.getItem('arc_db_v4');
                if(cached) {
                    db = JSON.parse(cached);
                    updateUI();
                    document.getElementById('loader').classList.add('loader-hidden');
                    alert("Offline Mode: Loaded from cache.");
                } else {
                    document.getElementById('error-msg').style.display='block';
                    document.getElementById('error-msg').innerText = "Sync Failed. Check URL.";
                }
            }
        }

        function updateUI() {
            if(db.settings && db.settings.daily_goal) {
                targets.cal = parseInt(db.settings.daily_goal);
                targets.pro = parseInt(db.settings.macro_pro);
                targets.carb = parseInt(db.settings.macro_carb);
                targets.fat = parseInt(db.settings.macro_fat);
            }
            processData();
            renderHistory();
        }

        function filterFoods() {
            const input = document.getElementById('foodSearch');
            const val = input.value.toLowerCase();
            const box = document.getElementById('suggestions');
            box.innerHTML = '';
            
            if(val.length < 1) { box.style.display = 'none'; return; }

            const matches = db.foods.map((f,i) => ({...f, idx:i})).filter(f => f.name.toLowerCase().includes(val));
            
            if(matches.length > 0) {
                box.style.display = 'block';
                matches.forEach(f => {
                    const displayUnit = f.measurement || f.unit || 'g';
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerHTML = `<span>${f.name}</span><span class="suggestion-meta">${displayUnit}</span>`;
                    div.onclick = () => {
                        input.value = f.name;
                        document.getElementById('selectedFoodIdx').value = f.idx;
                        document.getElementById('unitLabel').innerText = displayUnit;
                        box.style.display = 'none';
                    };
                    box.appendChild(div);
                });
            } else { box.style.display = 'none'; }
        }

        function processData() {
            // Logic: Dashboard data now comes primarily from db.daily
            // db.daily is the sheet that automatically resets on new date server-side
            
            let t = { cal:0, pro:0, carb:0, fat:0 };
            const list = document.getElementById('today-list');
            list.innerHTML = '';

            // Use db.daily if available, otherwise fallback to local filtering (e.g. offline mode)
            let todayItems = db.daily && db.daily.length > 0 ? db.daily : [];
            
            // Show logs in reverse order (newest first)
            [...todayItems].reverse().forEach(l => {
                t.cal += parseInt(l.cal || 0); t.pro += parseInt(l.pro || 0);
                t.carb += parseInt(l.carb || 0); t.fat += parseInt(l.fat || 0);
                
                const item = document.createElement('div');
                item.className = 'food-item';
                item.innerHTML = `<div class="food-main"><h4>${l.food}</h4><p>${l.qty} ${l.measurement || l.unit || ''}</p></div><div class="food-cal">${l.cal}</div>`;
                list.appendChild(item);
            });

            document.getElementById('ui-rem').innerText = targets.cal - t.cal;
            document.getElementById('ui-goal').innerText = targets.cal;
            const pct = Math.min(100, Math.round((t.cal/targets.cal)*100));
            document.getElementById('ui-percent').innerText = pct + '%';
            
            setBar('pro', t.pro, targets.pro);
            setBar('carb', t.carb, targets.carb);
            setBar('fat', t.fat, targets.fat);
        }

        function setBar(k, v, max) {
            document.getElementById(`bar-${k}`).style.width = Math.min(100, (v/max)*100)+'%';
            document.getElementById(`val-${k}`).innerText = `${v}/${max}`;
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            
            const todayISO = getLocalDate();
            const grouped = {};
            const sortedHistory = [...db.history].sort((a,b) => new Date(b.date) - new Date(a.date));

            sortedHistory.forEach(entry => {
                const date = entry.date.substring(0, 10);
                if(date === todayISO) return; // STRICTLY IGNORE TODAY in history tab

                if (!grouped[date]) grouped[date] = { cal:0, items: [] };
                grouped[date].cal += parseInt(entry.cal);
                grouped[date].items.push(entry);
            });

            Object.keys(grouped).forEach(d => {
                const div = document.createElement('div');
                div.className = 'food-item';
                div.innerHTML = `<div class="food-main"><h4>${d}</h4></div><div class="food-cal">${grouped[d].cal} kcal</div>`;
                list.appendChild(div);
            });
        }

        async function logFood() {
            const idx = document.getElementById('selectedFoodIdx').value;
            const qty = parseFloat(document.getElementById('qtyInput').value);
            if(!idx || !qty) return;

            const f = db.foods[idx];
            const base = f.base || f.baseqty || 100;
            const ratio = qty / base;
            const unitName = f.measurement || f.unit || 'g';

            const entry = {
                action: 'logFood',
                date: getLocalDate(),
                food: f.name,
                qty: qty,
                measurement: unitName,
                cal: Math.round(f.cal * ratio),
                pro: Math.round(f.pro * ratio),
                carb: Math.round(f.carb * ratio),
                fat: Math.round(f.fat * ratio)
            };

            // Optimistic Update: Push to daily and history locally
            if(!db.daily) db.daily = [];
            db.daily.push(entry);
            db.history.push(entry);
            
            localStorage.setItem('arc_db_v4', JSON.stringify(db));
            processData();
            
            // Reset Inputs
            document.getElementById('foodSearch').value = '';
            document.getElementById('selectedFoodIdx').value = '';
            document.getElementById('qtyInput').value = '';
            document.getElementById('unitLabel').innerText = 'Unit';
            
            await fetch(API_URL, { method: 'POST', body: JSON.stringify(entry) });
        }

        async function createNewFood() {
            const food = {
                action: 'addFood',
                name: document.getElementById('new-name').value,
                measurement: document.getElementById('new-unit').value,
                base: parseFloat(document.getElementById('new-base').value)||1,
                cal: parseFloat(document.getElementById('new-cal').value)||0,
                pro: parseFloat(document.getElementById('new-pro').value)||0,
                carb: parseFloat(document.getElementById('new-carb').value)||0,
                fat: parseFloat(document.getElementById('new-fat').value)||0
            };
            if(!food.name) return;
            
            db.foods.push(food);
            toggleModal('modal-add');
            await fetch(API_URL, { method: 'POST', body: JSON.stringify(food) });
        }

        async function calculateGoals() {
            const w = parseFloat(document.getElementById('calc-weight').value);
            const h = parseFloat(document.getElementById('calc-height').value);
            const age = parseFloat(document.getElementById('calc-age').value);
            const act = parseFloat(document.getElementById('calc-activity').value);
            const goalDiff = parseInt(document.getElementById('calc-goal').value);
            const gender = document.getElementById('calc-gender').value;

            if(!w) return;

            let bmr = (10*w) + (6.25*h) - (5*age) + (gender=='m'?5:-161);
            let target = Math.round(bmr*act) + goalDiff;
            
            // Update Local
            db.settings = {
                daily_goal: target,
                macro_pro: Math.round((target*0.3)/4),
                macro_carb: Math.round((target*0.35)/4),
                macro_fat: Math.round((target*0.35)/9)
            };
            
            // Save payload
            const load = {
                action: 'saveSettings',
                goal: db.settings.daily_goal,
                pro: db.settings.macro_pro,
                carb: db.settings.macro_carb,
                fat: db.settings.macro_fat
            };
            
            updateUI();
            switchView('home');
            
            await fetch(API_URL, { method: 'POST', body: JSON.stringify(load) });
            alert("Goals Saved to Cloud!");
        }

        function switchView(v) {
            document.querySelectorAll('.view-section').forEach(e=>e.classList.add('hidden'));
            document.getElementById(`view-${v}`).classList.remove('hidden');
            document.querySelectorAll('.nav-icon').forEach(e=>e.classList.remove('active'));
            document.getElementById(`nav-${v}`).classList.add('active');
        }
        function toggleModal(id) {
            const e = document.getElementById(id);
            e.style.display = e.style.display === 'flex' ? 'none' : 'flex';
        }

        init();
    </script>
</body>
</html>
