<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS // ASRS </title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- CORE VARIABLES --- */
        :root {
            --bg-color: #050505;
            --surface-color: #121212;
            --surface-hover: #1E1E1E;
            --accent-color: #FF5500;
            --text-primary: #FFFFFF;
            --text-secondary: #888888;
            --danger: #FF2A2A;
            --success: #00E055;
            --radius-lg: 28px;
            --radius-md: 16px;
            --radius-sm: 8px;
            --font-main: 'Inter', sans-serif;
            --font-tech: 'Space Mono', monospace;
            --grid-cols: 4; 
        }

        /* --- BASE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            overflow-x: hidden;
            min-height: 100vh;
            padding-bottom: 100px;
            background-image: radial-gradient(#222 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* --- LAYOUT SPLIT --- */
        .wrapper-fixed {
            max-width: 1400px; margin: 0 auto; padding: 20px;
            display: none; opacity: 0; transition: opacity 0.5s ease;
        }
        
        .wrapper-fluid {
            max-width: 1400px; /* Default */
            margin: 0 auto; padding: 0 20px 20px 20px;
            display: none; opacity: 0;
            transition: opacity 0.5s ease, max-width 0.4s ease-in-out;
        }

        .app-visible { display: block; opacity: 1; }

        /* WIDE MODES (Applied only to wrapper-fluid) */
        .fluid-wide-7 { max-width: 1650px; }
        .fluid-wide-8 { max-width: 98vw; } 

        /* --- CANVAS --- */
        #canvas-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        /* --- HEADER --- */
        header { margin-bottom: 40px; }
        .status-bar {
            font-family: var(--font-tech); font-size: 0.8rem; color: var(--text-secondary);
            margin-bottom: 8px; display: flex; justify-content: space-between; letter-spacing: 1px;
        }
        #user-identity { color: var(--accent-color); font-weight: bold; text-shadow: 0 0 10px rgba(255, 85, 0, 0.3); }

        .hero-card {
            background-color: var(--accent-color); color: #000; padding: 30px;
            border-radius: var(--radius-lg); width: 100%;
            display: flex; flex-direction: column; gap: 10px;
            box-shadow: 0 10px 30px rgba(255, 85, 0, 0.2);
        }
        .hero-title { font-size: 2rem; font-weight: 800; line-height: 1.1; }
        .progress-container { margin-top: 20px; display: flex; gap: 40px; }
        .stat-item h3 { font-size: 3rem; font-family: var(--font-tech); letter-spacing: -2px; }

        /* --- CONTROLS --- */
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn {
            background: var(--surface-color); border: 1px solid #333; color: white;
            padding: 10px 20px; border-radius: var(--radius-md); cursor: pointer;
            font-family: var(--font-tech); transition: all 0.2s ease;
        }
        .btn-glow {
            background: var(--surface-color); color: white; border: 1px solid var(--accent-color);
            box-shadow: 0 0 5px rgba(255, 85, 0, 0.2); font-weight: bold;
        }
        .btn-glow:hover {
            background: var(--accent-color); color: black; box-shadow: 0 0 20px rgba(255, 85, 0, 0.6); transform: translateY(-2px);
        }

        /* --- GRID SYSTEM --- */
        .grid-view { 
            display: grid; 
            grid-template-columns: repeat(var(--grid-cols), minmax(210px, 1fr)); 
            gap: 15px; 
        }
        .card {
            background: var(--surface-color); border-radius: var(--radius-lg);
            padding: 20px; min-height: 200px; border: 1px solid #222;
            display: flex; flex-direction: column; justify-content: space-between;
            overflow: hidden;
        }
        
        .card-header { display: flex; justify-content: space-between; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #333; }
        .status-due { background: var(--accent-color); box-shadow: 0 0 10px var(--accent-color); animation: pulse 2s infinite; }
        .status-ok { background: var(--success); }
        
        .topic-name { font-size: 1.2rem; font-weight: 600; margin-top: 10px; word-break: break-word; line-height: 1.3; }
        .card-meta { font-family: var(--font-tech); font-size: 0.7rem; color: var(--text-secondary); margin-top: 5px; }
        .card-actions { margin-top: auto; display: flex; gap: 8px; padding-top: 15px; }
        .action-btn { flex: 1; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 0.8rem; }
        .btn-review { background: var(--accent-color); color: black; }
        .btn-delete { background: transparent; color: var(--text-secondary); width: 25px; flex: none; border: 1px solid #333; }

        /* --- SKELETON LOADER --- */
        .skeleton {
            background: #111; border-radius: var(--radius-lg); min-height: 200px; padding: 24px;
            border: 1px solid #222; animation: pulse-gray 1.5s infinite ease-in-out;
        }
        .sk-line { height: 10px; background: #222; border-radius: 4px; margin-bottom: 10px; }
        .sk-block { height: 40px; width: 60%; background: #222; border-radius: 4px; margin-top: 20px; }
        @keyframes pulse-gray { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        /* --- MOBILE FIX --- */
        @media (max-width: 768px) {
            .wrapper-fixed, .wrapper-fluid { padding: 15px; max-width: 100%; }
            .hero-card { margin-top: -10px; padding: 25px; }
            .hero-title { font-size: 1.5rem; }
            .stat-item h3 { font-size: 2.2rem; }
            .grid-view { grid-template-columns: 1fr 1fr !important; gap: 10px; }
            .card { min-height: 180px; padding: 15px; border-radius: 16px; }
            .topic-name { font-size: 1rem; margin-top: 10px; }
        }

        /* --- BOTTOM NAV --- */
        .bottom-nav {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(18, 18, 18, 0.9); backdrop-filter: blur(10px);
            border: 1px solid #333; border-radius: 24px; padding: 10px 30px;
            display: flex; gap: 40px; z-index: 900; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-secondary); cursor: pointer; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { color: var(--accent-color); }
        .nav-icon { width: 24px; height: 24px; margin-bottom: 4px; fill: currentColor; }
        .nav-label { font-family: var(--font-tech); font-size: 0.65rem; }

        /* --- PROFILE POPUP --- */
        .modal { background: var(--surface-color); padding: 30px; border-radius: 28px; width: 90%; max-width: 500px; border: 1px solid #333; }
        .profile-header { text-align: center; margin-bottom: 30px; }
        .profile-avatar {
            width: 80px; height: 80px; background: #222; border-radius: 50%;
            margin: 0 auto 15px auto; display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--accent-color); font-size: 2rem; color: #fff;
        }
        .profile-stats {
            display: flex; justify-content: space-around; background: #000; padding: 15px; border-radius: 12px; margin-bottom: 20px; font-family: var(--font-tech);
        }
        .stat-box { text-align: center; }
        .stat-num { display: block; font-size: 1.2rem; color: #fff; font-weight: bold; }
        .stat-lbl { font-size: 0.7rem; color: #666; }

        .settings-box { background: #191919; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #333; }
        .settings-label { font-family: var(--font-tech); color: #888; font-size: 0.75rem; margin-bottom: 8px; display: block; }
        .form-input {
            width: 100%; background: #000; border: 1px solid #444; color: white;
            padding: 10px; font-family: var(--font-tech); font-size: 1rem; border-radius: 8px; cursor: pointer;
        }
        .form-input:focus { outline: none; border-color: var(--accent-color); }
        input[type="range"] { width: 100%; height: 6px; background: #333; border-radius: 3px; outline: none; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: var(--accent-color); border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(255,85,0,0.5); }
        .btn-save-settings { width: 100%; padding: 10px; margin-bottom: 20px; background: #333; color: white; border: none; font-family: var(--font-tech); border-radius: 8px; cursor: pointer; font-size: 0.8rem; }
        .btn-save-settings:hover { background: #444; }
        .btn-logout-pop { width: 100%; padding: 15px; background: rgba(255, 42, 42, 0.1); border: 1px solid var(--danger); color: var(--danger); font-family: var(--font-tech); font-weight: bold; cursor: pointer; border-radius: 12px; transition: 0.2s; }
        .btn-logout-pop:hover { background: var(--danger); color: white; }

        /* --- GATEKEEPER --- */
        .gatekeeper-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 5, 1); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .gatekeeper-card { width: 90%; max-width: 420px; background: var(--surface-color); border: 1px solid #333; padding: 40px; border-radius: 28px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); position: relative; overflow: hidden; }
        .gatekeeper-card::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--accent-color); box-shadow: 0 0 15px var(--accent-color); }
        .gate-title { font-family: var(--font-tech); color: #fff; font-size: 1.2rem; margin-bottom: 30px; letter-spacing: 2px; text-transform: uppercase; }
        .gate-input { width: 100%; background: #000; border: 1px solid #333; padding: 15px; color: white; font-family: var(--font-tech); border-radius: 12px; font-size: 1rem; text-align: center; margin-bottom: 15px; }
        .gate-input:focus { outline: none; border-color: var(--accent-color); }
        .gate-btn { width: 100%; padding: 15px; font-weight: bold; font-family: var(--font-tech); background: white; color: black; border-radius: 12px; cursor: pointer; border: none;}
        .switch-link { color: #555; margin-top: 25px; font-size: 0.75rem; cursor: pointer; font-family: var(--font-tech); display: inline-block; text-decoration: underline;}
        .loader-bar { height: 4px; width: 100%; background: #222; margin-top: 20px; display: none; }
        .loader-fill { height: 100%; width: 50%; background: var(--accent-color); animation: load 1.5s infinite ease-in-out; }

        /* --- MODALS --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal-active { display: flex !important; }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 85, 0, 0.4); } 70% { box-shadow: 0 0 0 10px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div class="gatekeeper-overlay" id="gatekeeper">
        <div class="gatekeeper-card" id="form-login">
            <div class="gate-title">System // Access</div>
            <input type="text" id="login-user" class="gate-input" placeholder="CODENAME" autocomplete="off">
            <input type="password" id="login-pass" class="gate-input" placeholder="PASSWORD">
            <button class="gate-btn" onclick="sfx.click(); performLogin()">DECRYPT & ENTER</button>
            <div class="loader-bar" id="loader-login"><div class="loader-fill"></div></div>
            <div class="switch-link" onclick="toggleAuthMode('signup')">Initialize New Identity</div>
        </div>
        <div class="gatekeeper-card" id="form-signup" style="display:none;">
            <div class="gate-title">System // Enlist</div>
            <div style="display:flex; gap:10px; margin-bottom: 15px;">
                <input type="text" id="signup-user" class="gate-input" placeholder="ENTER CODENAME" style="margin:0; font-weight:bold; color: var(--accent-color);">
                <button class="btn" onclick="generateCodename()" style="width: 50px; height: 100%; display:flex; align-items:center; justify-content:center;">↻</button>
            </div>
            <input type="password" id="signup-pass" class="gate-input" placeholder="CREATE PASSWORD">
            <button class="gate-btn" onclick="sfx.click(); performSignup()">CONFIRM IDENTITY</button>
            <div class="loader-bar" id="loader-signup"><div class="loader-fill"></div></div>
            <div class="switch-link" onclick="toggleAuthMode('login')">Back to Login</div>
        </div>
    </div>

    <div class="wrapper-fixed" id="app-header">
        <header>
            <div class="status-bar">
                <span id="user-identity">--</span>
                <span>SYSTEM ONLINE</span>
            </div>
            <div class="hero-card">
                <div class="hero-title">Cloud Knowledge Matrix.</div>
                <div class="progress-container">
                    <div class="stat-item"><h3 id="score-display">0%</h3><p>Retention</p></div>
                    <div class="stat-item"><h3 id="due-display">0</h3><p>Due Now</p></div>
                </div>
            </div>
        </header>
    </div>

    <div class="wrapper-fluid" id="app-grid">
        <div class="controls">
            <span class="section-label">Modules</span>
            <button class="btn btn-glow" id="btn-add-modal" onclick="sfx.click()">+ Add Topic</button>
        </div>

        <div class="grid-view" id="topic-grid"></div>
    </div>

    <div class="bottom-nav" id="bottom-nav" style="display:none;">
        <div class="nav-item active" onclick="showDashboard()">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 13h6a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1zm-1 7a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v4zm10 0a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-7a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v7zm1-10h6a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1z"/></svg>
            <span class="nav-label">GRID</span>
        </div>
        <div class="nav-item" onclick="openProfile()">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span class="nav-label">PROFILE</span>
        </div>
    </div>

    <div class="modal-overlay" id="add-modal">
        <div class="modal">
            <h2>New Topic</h2>
            <br>
            <input type="text" id="new-topic-name" placeholder="Enter topic name..." style="width:100%; background:transparent; border:none; border-bottom:2px solid #333; color:white; font-size:1.2rem; padding:10px 0; margin-bottom:20px; outline:none;" autocomplete="off">
            <textarea id="new-topic-desc" placeholder="Brief Description (Optional)..." style="width:100%; height:80px; background:#111; border:1px solid #333; color:#ccc; padding:10px; border-radius:8px; resize:none; font-family:var(--font-tech); margin-bottom:20px;"></textarea>
            <div style="display: flex; gap: 10px;">
                <button class="btn" id="btn-cancel" style="flex: 1" onclick="sfx.click()">Cancel</button>
                <button class="btn btn-primary" id="btn-create-topic" style="flex: 1" onclick="sfx.success()">Create</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="profile-modal">
        <div class="modal">
            <div class="profile-header">
                <div class="profile-avatar">
                    <svg style="width:40px; height:40px; fill:white;" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <h2 id="profile-name">--</h2>
            </div>
            <div class="profile-stats">
                <div class="stat-box"><span class="stat-num" id="stat-total">0</span><span class="stat-lbl">TOPICS</span></div>
                <div class="stat-box"><span class="stat-num" id="stat-due">0</span><span class="stat-lbl">DUE</span></div>
            </div>
            
            <div class="settings-box">
                <span class="settings-label">PREFERRED STUDY TIME</span>
                <input type="time" id="setting-time" class="form-input">
            </div>

            <div class="settings-box">
                <span class="settings-label">VISUAL INTERFACE</span>
                <select id="setting-theme" class="form-input">
                    <option value="void">VOID (STATIC)</option>
                    <option value="neural">NEURAL MESH</option>
                    <option value="matrix">DIGITAL RAIN</option>
                </select>
            </div>

            <div class="settings-box">
                <span class="settings-label">GRID DENSITY: <span id="grid-val-display" style="color:white; font-weight:bold;">4</span></span>
                <div style="display:flex; align-items:center; gap:10px;">
                    <span style="font-size:0.8rem; color:#666;">4</span>
                    <input type="range" id="setting-grid" min="4" max="8" value="4" oninput="updateGridPreview(this.value)">
                    <span style="font-size:0.8rem; color:#666;">8</span>
                </div>
            </div>

            <button class="btn-save-settings" onclick="sfx.click(); saveSettings()">UPDATE SYSTEMS</button>
            <button class="btn-logout-pop" onclick="sfx.click(); logout()">// TERMINATE SESSION (LOGOUT)</button>
            <br><br>
            <button class="btn" style="width:100%; border:none; color:#666;" onclick="sfx.click(); closeProfile()">Close</button>
        </div>
    </div>

    <script>
        // ---------------------------------------------------------
        // PASTE YOUR V6.7 GOOGLE SCRIPT URL HERE
        // ---------------------------------------------------------
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxqhlq19-8l-RmOVVGlzaOLhxm3g_cEiPzReXOF1__qGs0h8_qmAmUfnW14Q1k5kI1-Iw/exec'; 
        // ---------------------------------------------------------

        const wordsA = ["Iron", "Neon", "Solar", "Cyber", "Void", "Crimson", "Shadow", "Rogue", "Silent", "Rapid"];
        const wordsB = ["Wolf", "Falcon", "Eagle", "Echo", "Ghost", "Hawk", "Blade", "Runner", "Viper", "Storm"];

        let currentUser = { name: null, hex: null, preferredTime: "09:00" };
        let topics = [];
        let currentTheme = 'void';
        let currentGrid = 4;

        // --- SONIC INTERFACE ---
        const sfx = {
            ctx: null,
            init: function() { window.AudioContext = window.AudioContext || window.webkitAudioContext; this.ctx = new AudioContext(); },
            playTone: function(freq, type, duration, vol) {
                if (!this.ctx) this.init();
                const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + duration);
            },
            click: function() { this.playTone(800, 'sine', 0.05, 0.05); },
            success: function() { this.playTone(523.25, 'sine', 0.3, 0.05); setTimeout(() => this.playTone(659.25, 'sine', 0.4, 0.05), 50); }
        };

        // --- VISUAL THEME ENGINE ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = []; let matrixDrops = [];
        
        function initThemeEngine() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            setTheme(currentTheme); animateTheme();
        }

        function setTheme(mode) {
            currentTheme = mode; ctx.clearRect(0, 0, canvas.width, canvas.height);
            if(mode === 'neural') {
                particles = []; let n = (canvas.height * canvas.width) / 9000;
                for (let i=0; i<n; i++) particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5, size: Math.random()*2 });
            } else if (mode === 'matrix') {
                const fontSize = 14; const columns = canvas.width / fontSize;
                matrixDrops = []; for(let x=0; x<columns; x++) matrixDrops[x] = 1;
            }
        }

        function animateTheme() {
            requestAnimationFrame(animateTheme);
            if(currentTheme === 'void') { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }
            if(currentTheme === 'neural') {
                ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#333';
                particles.forEach((p, i) => {
                    p.x += p.vx; p.y += p.vy;
                    if(p.x < 0 || p.x > canvas.width) p.vx *= -1; if(p.y < 0 || p.y > canvas.height) p.vy *= -1;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                    for(let j=i; j<particles.length; j++) {
                        let dx = p.x - particles[j].x; let dy = p.y - particles[j].y; let dist = dx*dx + dy*dy;
                        if(dist < 20000) { ctx.strokeStyle = `rgba(255, 85, 0, ${1 - dist/20000})`; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); }
                    }
                });
            }
            if(currentTheme === 'matrix') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#FF5500'; ctx.font = '14px monospace';
                for(let i=0; i<matrixDrops.length; i++) {
                    const text = String.fromCharCode(0x30A0 + Math.random() * 96); ctx.fillText(text, i*14, matrixDrops[i]*14);
                    if(matrixDrops[i]*14 > canvas.height && Math.random() > 0.975) matrixDrops[i] = 0; matrixDrops[i]++;
                }
            }
        }
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; setTheme(currentTheme); });

        // --- AUTH & INIT ---
        window.onload = function() { checkSession(); initThemeEngine(); };

        function checkSession() {
            const savedHex = localStorage.getItem('nexus_hex');
            const savedName = localStorage.getItem('nexus_name');
            if(savedHex && savedName) {
                currentUser.hex = savedHex; currentUser.name = savedName;
                currentUser.preferredTime = localStorage.getItem('nexus_time') || "09:00";
                currentGrid = localStorage.getItem('nexus_grid') || 4;
                currentTheme = localStorage.getItem('nexus_theme') || 'void';
                applySettings(currentTheme, currentGrid);
                unlockApp(); syncDown(); 
            } else { generateCodename(); }
        }

        // --- LOGIC ---
        function generateCodename() {
            const rA = wordsA[Math.floor(Math.random() * wordsA.length)];
            const rB = wordsB[Math.floor(Math.random() * wordsB.length)];
            document.getElementById('signup-user').value = rA + rB;
        }
        function toggleAuthMode(mode) {
            document.getElementById('form-login').style.display = mode === 'login' ? 'block' : 'none';
            document.getElementById('form-signup').style.display = mode === 'signup' ? 'block' : 'none';
        }
        function updateGridPreview(val) { document.getElementById('grid-val-display').innerText = val; }

        function applySettings(theme, grid) {
            setTheme(theme);
            document.documentElement.style.setProperty('--grid-cols', grid);
            
            // EXPAND CONTAINER LOGIC
            const appFluid = document.getElementById('app-grid');
            appFluid.classList.remove('fluid-wide-7', 'fluid-wide-8');
            if(grid >= 7) appFluid.classList.add('fluid-wide-7');
            if(grid == 8) appFluid.classList.add('fluid-wide-8');
            
            currentGrid = grid; currentTheme = theme;
        }

        function unlockApp() {
            document.getElementById('gatekeeper').style.display = 'none';
            // Show both decks
            document.getElementById('app-header').classList.add('app-visible');
            document.getElementById('app-grid').classList.add('app-visible');
            document.getElementById('bottom-nav').style.display = 'flex';
            document.getElementById('user-identity').innerText = currentUser.name.toUpperCase();
            applySettings(currentTheme, currentGrid);
        }
        function logout() { localStorage.clear(); location.reload(); }
        function showDashboard() { closeProfile(); }
        
        function openProfile() {
            document.getElementById('profile-name').innerText = currentUser.name;
            document.getElementById('stat-total').innerText = topics.length;
            const dueCount = topics.filter(t => { const today = new Date(); today.setHours(0,0,0,0); const reviewDate = new Date(t.nextReview); reviewDate.setHours(0,0,0,0); return today.getTime() >= reviewDate.getTime(); }).length;
            document.getElementById('stat-due').innerText = dueCount;
            document.getElementById('setting-time').value = currentUser.preferredTime;
            document.getElementById('setting-theme').value = currentTheme;
            document.getElementById('setting-grid').value = currentGrid;
            document.getElementById('grid-val-display').innerText = currentGrid;
            document.getElementById('profile-modal').classList.add('modal-active');
        }
        function closeProfile() { document.getElementById('profile-modal').classList.remove('modal-active'); }

        async function saveSettings() {
            const newTime = document.getElementById('setting-time').value;
            const newTheme = document.getElementById('setting-theme').value;
            const newGrid = document.getElementById('setting-grid').value;
            
            // 1. Update Local State (Instant)
            currentUser.preferredTime = newTime;
            localStorage.setItem('nexus_time', newTime);
            localStorage.setItem('nexus_theme', newTheme);
            localStorage.setItem('nexus_grid', newGrid);
            
            // 2. Apply Visuals (Instant)
            applySettings(newTheme, newGrid);

            // 3. UI FEEDBACK (MOVED UP - HAPPENS INSTANTLY)
            sfx.success();
            closeProfile();

            // 4. Send to Database (Background Process)
            // We removed 'await' so the code doesn't stop here.
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST', body: JSON.stringify({ 
                    action: 'UPDATE_SETTINGS', 
                    hex: currentUser.hex, 
                    time: newTime,
                    theme: newTheme,
                    grid: newGrid
                })
            }).catch(e => console.error("Background Save Error:", e));
        }

        // --- NETWORK ---
        async function performLogin() {
            const user = document.getElementById('login-user').value.trim(); const pass = document.getElementById('login-pass').value;
            if(!user || !pass) return alert("Credentials missing."); document.getElementById('loader-login').style.display = 'block';
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'LOGIN', email: user, password: pass }) });
                const data = await res.json();
                if(data.status === 'SUCCESS') {
                    localStorage.setItem('nexus_hex', data.hex); localStorage.setItem('nexus_name', user); localStorage.setItem('nexus_time', data.time); localStorage.setItem('nexus_theme', data.theme); localStorage.setItem('nexus_grid', data.grid);
                    currentUser = { hex: data.hex, name: user, preferredTime: data.time }; currentTheme = data.theme; currentGrid = data.grid;
                    unlockApp(); syncDown(); sfx.success();
                } else { alert("ACCESS DENIED: " + data.message); }
            } catch(e) { alert("Network Error."); } document.getElementById('loader-login').style.display = 'none';
        }
        async function performSignup() {
            const user = document.getElementById('signup-user').value.trim(); const pass = document.getElementById('signup-pass').value;
            if(!user || !pass) return alert("Missing info."); document.getElementById('loader-signup').style.display = 'block';
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'SIGNUP', email: user, password: pass }) });
                const data = await res.json();
                if(data.status === 'SUCCESS') {
                    localStorage.setItem('nexus_hex', data.hex); localStorage.setItem('nexus_name', user); localStorage.setItem('nexus_time', "09:00"); localStorage.setItem('nexus_theme', "void"); localStorage.setItem('nexus_grid', 4);
                    currentUser = { hex: data.hex, name: user, preferredTime: "09:00" }; window.location.href = 'guide.html';
                } else { alert("ERROR: " + data.message); }
            } catch(e) { alert("Network Error."); } document.getElementById('loader-signup').style.display = 'none';
        }

        function renderSkeleton() {
            const grid = document.getElementById('topic-grid'); grid.innerHTML = '';
            for(let i=0; i<currentGrid*2; i++) {
                const skel = document.createElement('div'); skel.className = 'skeleton';
                skel.innerHTML = `<div class="sk-line" style="width:40%"></div><div class="sk-line" style="width:80%"></div><div class="sk-block"></div>`;
                grid.appendChild(skel);
            }
        }

        async function syncDown() {
            if(!currentUser.hex) return; renderSkeleton();
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL + '?hex=' + currentUser.hex);
                const data = await res.json();
                if(Array.isArray(data)) { topics = data; render(); }
            } catch(e) { console.log(e); }
        }
        async function syncUp() { try { await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'SYNC_UP', hex: currentUser.hex, topics: topics }) }); } catch(e) { console.log("Save failed"); } }

        // --- TOPIC LOGIC ---
        function createTopic(name, desc) { return { id: 'top_' + Date.now(), name: name, desc: desc, level: 0, nextReview: new Date().getTime() }; }
        function calculateNextReview(level) {
            const now = new Date(); const intervals = [0, 1, 3, 7, 14, 30, 90]; 
            const daysToAdd = intervals[Math.min(level, intervals.length - 1)]; now.setDate(now.getDate() + daysToAdd); return now.getTime();
        }
        function processReview(id, success) {
            const topic = topics.find(t => t.id === id);
            if (topic) {
                if (success) { topic.level = Math.min(topic.level + 1, 6); sfx.success(); openGoogleCalendar(topic, calculateNextReview(topic.level), currentUser.preferredTime); } 
                else { topic.level = Math.max(topic.level - 1, 0); sfx.click(); }
                topic.nextReview = calculateNextReview(topic.level); render(); syncUp();
            }
        }
        function deleteTopic(id) { if(confirm("Delete?")) { topics = topics.filter(t => t.id !== id); render(); syncUp(); } }

        function openGoogleCalendar(topic, nextReviewDate, timeString) {
            const dateObj = new Date(nextReviewDate);
            const [hours, minutes] = timeString.split(':').map(Number);
            dateObj.setHours(hours, minutes, 0, 0);
            const startISO = dateObj.toISOString().replace(/-|:|\.\d\d\d/g, "");
            dateObj.setMinutes(minutes + 30);
            const endISO = dateObj.toISOString().replace(/-|:|\.\d\d\d/g, "");
            
            const title = encodeURIComponent(`NEXUS: ${topic.name}`);
            
            let message = `ACTIVE RECALL SESSION\n\nTarget: ${topic.name}\nProtocol: Test your memory immediately.\n`;
            if (topic.desc) message += `\n[USER NOTES]:\n${topic.desc}\n`;
            
            const details = encodeURIComponent(message);
            const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${startISO}/${endISO}&details=${details}&sf=true&output=xml`;
            window.open(url, '_blank');
        }

        // --- ANIMATION UTIL ---
        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    // Ensure final value (especially for string append)
                    if(obj.id === 'score-display') obj.innerHTML = end + "%";
                    else obj.innerHTML = end;
                }
            };
            window.requestAnimationFrame(step);
        }

        function render() {
            const grid = document.getElementById('topic-grid'); grid.innerHTML = '';
            const today = new Date(); today.setHours(0,0,0,0);
            
            let dueCount = 0;
            let totalLevel = 0;

            topics.forEach(t => {
                const reviewDate = new Date(t.nextReview); reviewDate.setHours(0,0,0,0);
                const due = today.getTime() >= reviewDate.getTime();
                if(due) dueCount++;
                totalLevel += t.level;

                const statusClass = due ? 'status-due' : 'status-ok';
                const dateString = new Date(t.nextReview).toLocaleDateString(undefined, {month:'short', day:'numeric'});
                const card = document.createElement('div'); card.className = 'card';
                card.innerHTML = `
                    <div class="card-header"><div class="status-dot ${statusClass}"></div><div class="card-meta">LVL ${t.level}</div></div>
                    <div class="topic-name">${t.name}</div>
                    <div class="card-meta" style="margin-top:auto; margin-bottom:10px;">${due ? 'REVIEW REQUIRED' : 'Next: ' + dateString}</div>
                    <div class="card-actions">
                        ${due ? `<button class="action-btn btn-review" onclick="processReview('${t.id}', true)">Review</button>` : `<button class="action-btn" style="background:#222; color:#555; cursor:default">Done</button>`}
                        <button class="action-btn btn-delete" onclick="deleteTopic('${t.id}')">×</button>
                    </div>`;
                grid.appendChild(card);
            });

            // FIXED: Update Stats with Animation
            const avgRetention = topics.length ? Math.round((totalLevel / (topics.length * 6)) * 100) : 0;
            animateValue(document.getElementById('due-display'), 0, dueCount, 1500);
            animateValue(document.getElementById('score-display'), 0, avgRetention, 1500);
        }

        // --- EVENTS ---
        document.getElementById('btn-add-modal').addEventListener('click', () => { document.getElementById('add-modal').classList.add('modal-active'); setTimeout(() => document.getElementById('new-topic-name').focus(), 50); });
        document.getElementById('btn-cancel').addEventListener('click', () => document.getElementById('add-modal').classList.remove('modal-active'));
        document.getElementById('btn-create-topic').addEventListener('click', () => {
            const name = document.getElementById('new-topic-name').value.trim();
            const desc = document.getElementById('new-topic-desc').value.trim();
            if(name) { 
                topics.push(createTopic(name, desc)); 
                render(); syncUp(); 
                document.getElementById('add-modal').classList.remove('modal-active'); 
                document.getElementById('new-topic-name').value = '';
                document.getElementById('new-topic-desc').value = ''; 
            }
        });
    </script>
</body>
</html>
