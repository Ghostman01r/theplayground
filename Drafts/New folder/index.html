<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FolderForge // Icon Generator</title>
    <!-- Fonts for customization -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Pacifico&family=Orbitron:wght@700&family=Anton&family=Roboto+Slab:wght@700&family=Bangers&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0F0F12;
            --panel-bg: #1A1A1D;
            --accent: #4F46E5;
            --text: #FFFFFF;
            --border: #333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            width: 1000px;
            height: 850px; /* Increased height for upload controls */
            background: var(--panel-bg);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }

        /* --- LEFT PANEL: CONTROLS --- */
        .controls {
            padding: 40px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 25px;
            overflow-y: auto;
        }

        .header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 5px; }
        .header p { color: #888; font-size: 0.85rem; }

        .control-group { display: flex; flex-direction: column; gap: 10px; }
        .label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #888; display: flex; justify-content: space-between; }
        .value-display { color: var(--accent); font-size: 0.75rem; }

        input[type="text"], select {
            background: #252529;
            border: 1px solid #444;
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
            width: 100%;
        }
        input[type="text"]:focus, select:focus { border-color: var(--accent); }

        /* File Upload */
        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .btn-upload {
            border: 2px dashed #444;
            color: #888;
            background-color: #252529;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .btn-upload:hover { border-color: var(--accent); color: var(--accent); }
        .file-upload-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0; top: 0; opacity: 0;
            cursor: pointer;
        }

        .checkbox-wrapper {
            display: flex; align-items: center; gap: 10px;
            font-size: 0.85rem; color: #ccc; cursor: pointer;
        }
        .checkbox-wrapper input { cursor: pointer; }

        /* Ranges / Sliders */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px; width: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            margin-top: -6px;
            border: 2px solid #fff;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer;
            background: #444;
            border-radius: 2px;
        }

        /* Color Swatches Grid */
        .swatches-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 5px;
        }
        
        .swatch {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.1s;
        }
        .swatch:hover { transform: scale(1.1); }
        .swatch.active { border-color: white; transform: scale(1.1); }

        .color-picker-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #252529;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            cursor: pointer;
        }
        
        input[type="color"] {
            -webkit-appearance: none;
            appearance: none;
            border: none;
            width: 30px;
            height: 30px;
            background: none;
            cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }

        .btn-dl {
            margin-top: auto;
            background: var(--accent);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-dl:hover { background: #4338CA; transform: translateY(-2px); }

        /* --- RIGHT PANEL: PREVIEW --- */
        .preview-area {
            background-image: 
                radial-gradient(#2A2A2E 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        canvas {
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.3));
            max-width: 80%;
            height: auto;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.27);
        }
        canvas:hover { transform: scale(1.02); }

        .preview-label {
            position: absolute; bottom: 30px;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #aaa;
            backdrop-filter: blur(5px);
        }

        @media (max-width: 800px) {
            .app-container { grid-template-columns: 1fr; height: auto; min-height: 100vh; width: 100%; border-radius: 0; }
            .controls { order: 2; border-right: none; border-top: 1px solid var(--border); }
            .preview-area { order: 1; height: 350px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- CONTROL PANEL -->
        <div class="controls">
            <div class="header">
                <h1>FolderForge</h1>
                <p>Create custom desktop icons instantly.</p>
            </div>

            <div class="control-group">
                <span class="label">Label Text</span>
                <input type="text" id="inputText" placeholder="DOCS" maxlength="8" value="WORK">
            </div>

            <div class="control-group">
                <span class="label">Style</span>
                <select id="inputStyle">
                    <option value="modern">Modern Sleek</option>
                    <option value="classic">Classic Tab</option>
                    <option value="glass">Frosted Glass</option>
                    <option value="outline">Cyber Outline</option>
                    <option value="custom">★ Upload Custom Image</option>
                </select>
            </div>

            <!-- UPLOAD SECTION (Visible when 'custom' is selected or always) -->
            <div class="control-group" id="uploadGroup" style="display:none; padding:10px; background:#222; border-radius:8px; border:1px solid #333;">
                <span class="label">Upload Base Image</span>
                <div class="file-upload-wrapper">
                    <button class="btn-upload">Select Image File...</button>
                    <input type="file" id="fileInput" accept="image/*">
                </div>
                <label class="checkbox-wrapper" style="margin-top:8px;">
                    <input type="checkbox" id="removeBgCheck">
                    Remove White Background
                </label>
            </div>

            <div class="control-group" id="colorGroup">
                <span class="label">Folder Color</span>
                <div class="swatches-container" id="swatches"></div>
                <label class="color-picker-wrapper">
                    <input type="color" id="inputBaseColor" value="#3b82f6">
                    <span id="colorHex" style="font-family: monospace; font-size: 0.9rem;">#3B82F6</span>
                    <span style="margin-left:auto; font-size:0.8rem; color:#666;">Custom</span>
                </label>
            </div>

            <div class="control-group">
                <span class="label">Text Size <span id="sizeVal" class="value-display">120px</span></span>
                <input type="range" id="textSize" min="40" max="250" value="120">
            </div>

            <div class="control-group">
                <span class="label">Text Position Y <span id="posVal" class="value-display">40</span></span>
                <input type="range" id="textY" min="-150" max="150" value="40">
            </div>

            <div class="control-group">
                <span class="label">Typography</span>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <select id="inputFont">
                        <option value="Inter">Standard (Inter)</option>
                        <option value="Anton">Bold (Anton)</option>
                        <option value="Roboto Slab">Serif (Roboto)</option>
                        <option value="Orbitron">Sci-Fi (Orbitron)</option>
                        <option value="Bangers">Comic (Bangers)</option>
                        <option value="Pacifico">Handwritten (Pacifico)</option>
                    </select>
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                        <span style="font-size: 0.8rem; color: #888;">Text Color:</span>
                        <div class="color-picker-wrapper" style="padding: 5px 10px; width: auto;">
                            <input type="color" id="inputTextColor" value="#ffffff">
                        </div>
                    </div>
                </div>
            </div>

            <button class="btn-dl" onclick="downloadIcon()">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Download Icon
            </button>
        </div>

        <!-- PREVIEW AREA -->
        <div class="preview-area">
            <canvas id="canvas" width="512" height="512"></canvas>
            <div class="preview-label">512 x 512 px • PNG</div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Elements
        const textInput = document.getElementById('inputText');
        const colorInput = document.getElementById('inputBaseColor');
        const hexDisplay = document.getElementById('colorHex');
        const styleInput = document.getElementById('inputStyle');
        const fontInput = document.getElementById('inputFont');
        const textColorInput = document.getElementById('inputTextColor');
        const swatchesContainer = document.getElementById('swatches');
        const textSizeInput = document.getElementById('textSize');
        const textYInput = document.getElementById('textY');
        const sizeVal = document.getElementById('sizeVal');
        const posVal = document.getElementById('posVal');
        
        // Upload Elements
        const fileInput = document.getElementById('fileInput');
        const uploadGroup = document.getElementById('uploadGroup');
        const colorGroup = document.getElementById('colorGroup');
        const removeBgCheck = document.getElementById('removeBgCheck');

        // State
        let config = {
            text: "WORK",
            color: "#3b82f6",
            style: "modern",
            font: "Inter",
            textColor: "#ffffff",
            textSize: 120,
            textY: 40,
            customImage: null
        };

        const PRESETS = [ "#EF4444", "#F97316", "#F59E0B", "#10B981", "#06B6D4", "#3B82F6", "#6366F1", "#8B5CF6", "#EC4899", "#64748B" ];

        function initSwatches() {
            PRESETS.forEach(color => {
                const el = document.createElement('div');
                el.className = 'swatch';
                el.style.backgroundColor = color;
                if(color.toLowerCase() === config.color.toLowerCase()) el.classList.add('active');
                el.onclick = () => {
                    config.color = color; colorInput.value = color; hexDisplay.innerText = color.toUpperCase();
                    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
                    el.classList.add('active'); draw();
                };
                swatchesContainer.appendChild(el);
            });
        }

        // --- DRAWING ENGINE ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width; const h = canvas.height; const p = 40;

            // Gradient Helper for generated shapes
            const gradient = ctx.createLinearGradient(0, 0, 0, h);
            gradient.addColorStop(0, lightenColor(config.color, 20));
            gradient.addColorStop(1, config.color);
            ctx.fillStyle = gradient;
            ctx.strokeStyle = config.color;

            // DRAW BASE SHAPE OR IMAGE
            if (config.style === 'custom' && config.customImage) {
                // Draw Uploaded Image
                ctx.drawImage(config.customImage, 0, 0, w, h);
                
                // Remove White Background Logic
                if (removeBgCheck.checked) {
                    const imageData = ctx.getImageData(0, 0, w, h);
                    const data = imageData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        // If pixel is near white
                        if (r > 240 && g > 240 && b > 240) {
                            data[i + 3] = 0; // Set Alpha to 0
                        }
                    }
                    ctx.putImageData(imageData, 0, 0);
                }
            } else {
                if (config.style === 'modern') drawModernShape(ctx, w, h, p);
                else if (config.style === 'classic') drawClassicShape(ctx, w, h, p);
                else if (config.style === 'outline') drawOutlineShape(ctx, w, h, p);
                else if (config.style === 'glass') drawGlassShape(ctx, w, h, p);
            }

            // DRAW TEXT LAYER
            ctx.fillStyle = config.textColor;
            ctx.font = `bold ${config.textSize}px ${config.font}`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowColor = "rgba(0,0,0,0.3)";
            ctx.shadowBlur = 15;
            ctx.shadowOffsetY = 5;

            ctx.fillText(config.text, w/2, h/2 + parseInt(config.textY));
            ctx.shadowColor = "transparent";
        }

        // --- SHAPE ALGORITHMS (Existing) ---
        function drawModernShape(ctx, w, h, p) {
            ctx.fillStyle = darkenColor(config.color, 20); ctx.beginPath(); ctx.roundRect(p, p+40, w-(p*2), h-(p*2)-40, 40); ctx.fill();
            const gradient = ctx.createLinearGradient(0, 0, 0, h); gradient.addColorStop(0, lightenColor(config.color, 10)); gradient.addColorStop(1, config.color); ctx.fillStyle = gradient;
            ctx.beginPath(); ctx.moveTo(p, h-p-30); ctx.lineTo(p, h/2 - 40); ctx.quadraticCurveTo(p, h/2 - 80, p+40, h/2 - 80); ctx.lineTo(w-p-40, h/2 - 80); ctx.quadraticCurveTo(w-p, h/2 - 80, w-p, h/2 - 40); ctx.lineTo(w-p, h-p-30); ctx.quadraticCurveTo(w-p, h-p, w-p-30, h-p); ctx.lineTo(p+30, h-p); ctx.quadraticCurveTo(p, h-p, p, h-p-30); ctx.fill();
        }
        function drawClassicShape(ctx, w, h, p) {
            const tabH = 60; const tabW = 200; ctx.fillStyle = config.color; ctx.beginPath(); ctx.moveTo(p, p + tabH); ctx.lineTo(p, p + 20); ctx.quadraticCurveTo(p, p, p + 20, p); ctx.lineTo(p + tabW, p); ctx.quadraticCurveTo(p + tabW + 20, p, p + tabW + 20, p + tabH); ctx.lineTo(w - p - 30, p + tabH); ctx.quadraticCurveTo(w - p, p + tabH, w - p, p + tabH + 30); ctx.lineTo(w - p, h - p - 30); ctx.quadraticCurveTo(w - p, h - p, w - p - 30, h - p); ctx.lineTo(p + 30, h - p); ctx.quadraticCurveTo(p, h - p, p, h - p - 30); ctx.lineTo(p, p + tabH); ctx.fill(); ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.lineWidth = 4; ctx.stroke();
        }
        function drawGlassShape(ctx, w, h, p) {
            const backP = p + 20; ctx.fillStyle = config.color; ctx.beginPath(); const tabW = w * 0.5; const tabH = 80; ctx.roundRect(backP, backP + tabH - 20, w - (backP*2), h - (backP*2) - tabH + 20, 40); ctx.fill(); ctx.beginPath(); ctx.roundRect(backP, backP, tabW, tabH, 20); ctx.fill();
            const frontP = p; const glassY = h * 0.35; const gGrad = ctx.createLinearGradient(0, glassY, w, h); gGrad.addColorStop(0, "rgba(255, 255, 255, 0.4)"); gGrad.addColorStop(1, "rgba(255, 255, 255, 0.1)"); ctx.fillStyle = gGrad; ctx.beginPath(); ctx.roundRect(frontP, glassY, w - (frontP*2), h - glassY - frontP, 30); ctx.fill(); ctx.strokeStyle = "rgba(255, 255, 255, 0.4)"; ctx.lineWidth = 2; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(frontP + 30, glassY + 2); ctx.lineTo(w - frontP - 30, glassY + 2); ctx.strokeStyle = "rgba(255, 255, 255, 0.6)"; ctx.lineWidth = 2; ctx.stroke();
        }
        function drawOutlineShape(ctx, w, h, p) {
            ctx.fillStyle = "rgba(0,0,0,0.2)"; ctx.strokeStyle = config.color; ctx.lineWidth = 15; ctx.beginPath(); ctx.roundRect(p+20, p+60, w-(p*2)-40, h-(p*2)-80, 40); ctx.fill(); ctx.stroke(); ctx.shadowColor = config.color; ctx.shadowBlur = 30; ctx.stroke(); ctx.shadowBlur = 0; 
        }

        // --- UTILS ---
        function lightenColor(color, percent) { let num = parseInt(color.replace("#",""),16), amt = Math.round(2.55 * percent), R = (num >> 16) + amt, B = (num >> 8 & 0x00FF) + amt, G = (num & 0x0000FF) + amt; return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (B<255?B<1?0:B:255)*0x100 + (G<255?G<1?0:G:255)).toString(16).slice(1); }
        function darkenColor(color, percent) { let num = parseInt(color.replace("#",""),16), amt = Math.round(2.55 * percent), R = (num >> 16) - amt, B = (num >> 8 & 0x00FF) - amt, G = (num & 0x0000FF) - amt; return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (B<255?B<1?0:B:255)*0x100 + (G<255?G<1?0:G:255)).toString(16).slice(1); }
        function downloadIcon() { const link = document.createElement('a'); link.download = `${config.text}_icon.png`; link.href = canvas.toDataURL(); link.click(); }

        // --- EVENTS ---
        textInput.addEventListener('input', (e) => { config.text = e.target.value.toUpperCase(); draw(); });
        colorInput.addEventListener('input', (e) => { config.color = e.target.value; hexDisplay.innerText = e.target.value.toUpperCase(); document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active')); draw(); });
        fontInput.addEventListener('change', (e) => { config.font = e.target.value; draw(); });
        textColorInput.addEventListener('input', (e) => { config.textColor = e.target.value; draw(); });
        textSizeInput.addEventListener('input', (e) => { config.textSize = e.target.value; sizeVal.innerText = e.target.value + 'px'; draw(); });
        textYInput.addEventListener('input', (e) => { config.textY = e.target.value; posVal.innerText = e.target.value; draw(); });
        
        removeBgCheck.addEventListener('change', draw);

        // Style Switcher
        styleInput.addEventListener('change', (e) => { 
            config.style = e.target.value;
            // Toggle Visibility of Upload vs Color controls
            if(config.style === 'custom') {
                uploadGroup.style.display = 'block';
                colorGroup.style.display = 'none';
            } else {
                uploadGroup.style.display = 'none';
                colorGroup.style.display = 'flex';
            }
            draw(); 
        });

        // File Upload Handler
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        config.customImage = img;
                        // Auto-switch to custom style if not already
                        if (styleInput.value !== 'custom') {
                            styleInput.value = 'custom';
                            styleInput.dispatchEvent(new Event('change'));
                        }
                        draw();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        initSwatches();
        draw();
    </script>
</body>
</html>
